[build]
  command = "npm run build"
  publish = "dist"
  # Every Netlify build costs money, so skip one when nothing the web bundle
  # is built from changed: the database and Edge Functions (supabase/, which
  # deploy through the Supabase integration), docs, audit notes and the
  # top-level Markdown files. Netlify skips the build when this exits 0;
  # `git diff --quiet` exits 0 when no file outside these paths changed. On a
  # first build CACHED_COMMIT_REF is unset, the diff errors, and it builds.
  ignore = "git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- . ':(exclude)supabase/' ':(exclude)docs/' ':(exclude)audit-findings/' ':(exclude,glob)*.md'"

# Environment variables are set in the Netlify dashboard:
# Site configuration → Environment variables → Add variables:
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_ANON_KEY
#   VITE_MAPTILER_KEY     (free key from maptiler.com/cloud; drives the
#                          vector basemap on cardio route maps. If
#                          unset, the app falls back to OpenFreeMap.)
#   VITE_PUBLIC_ORIGIN    (optional. The origin baked into PRINTED links —
#                          today only the gym signage QR. Unset, that is
#                          https://flexyn.netlify.app. Set it to
#                          https://flexyn.app once /checkin/:code,
#                          /gym/:id and /p/gym/:id resolve to the app
#                          there; flexyn.app 404s on all three as of
#                          2026-08-09. See src/lib/appOrigin.js.)
#   VITE_MARKETING_ORIGIN (optional. Set to https://flexyn.app once the
#                          landing site serves /p/gym/:id. Someone who
#                          scans a gym poster WITHOUT an account is then
#                          handed to the landing page — the store links
#                          are what they need — instead of the app's own
#                          read-only gym view. Unset = keep them in the
#                          app, which is what works today.)
#   VITE_POSTHOG_KEY      (optional. PostHog project API key, the public
#                          "phc_..." one. Unset = analytics stay off and
#                          nothing is sent. See src/lib/analytics.js.)
#   VITE_POSTHOG_HOST     (optional. Defaults to https://us.i.posthog.com;
#                          use https://eu.i.posthog.com for an EU project.)
# Never hardcode secrets here — this file is committed to version control.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers (2026-09-27 codebase audit, item 8). Every one of these is
# safe for what the app loads today:
#   * frame-ancestors 'none' + X-Frame-Options: nobody can frame the app, so
#     a lookalike page cannot overlay the Sell or Gift buttons (clickjacking).
#     The CSP carries ONLY frame-ancestors on purpose. A full source list has
#     to name Supabase, MapTiler, OpenFreeMap, the Overpass mirrors,
#     Nominatim, PostHog, Sentry and the MediaPipe wasm, and a wrong one
#     blanks the site with nothing in the logs. Add it as
#     Content-Security-Policy-Report-Only first and read the console.
#   * Referrer-Policy: other sites see our origin, never the path, so a
#     /p/gym/:id or /checkin/:code link does not leak on an outbound click.
#   * Permissions-Policy: camera, microphone, location and motion stay
#     available to the app itself and are refused to any embedded frame.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self), accelerometer=(self), gyroscope=(self), payment=(), usb=()"
