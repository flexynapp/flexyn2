[build]
  command = "npm run build"
  publish = "dist"

# Environment variables are set in the Netlify dashboard:
# Site configuration → Environment variables → Add variables:
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_ANON_KEY
# Never hardcode secrets here — this file is committed to version control.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
