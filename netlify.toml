[build]
  command = "npm run build"
  publish = "dist"

# Environment variables are set in the Netlify dashboard:
# Site configuration → Environment variables → Add variables:
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_ANON_KEY
#   VITE_MAPTILER_KEY     (free key from maptiler.com/cloud; drives the
#                          vector basemap on cardio route maps. If
#                          unset, the app falls back to OpenFreeMap.)
#   VITE_PUBLIC_ORIGIN    (optional. The origin baked into PRINTED links —
#                          today only the gym signage QR. Unset, that is
#                          https://flexyn.netlify.app. Set it to
#                          https://flexyn.app once /checkin/:code,
#                          /gym/:id and /p/gym/:id resolve to the app
#                          there; flexyn.app 404s on all three as of
#                          2026-08-09. See src/lib/appOrigin.js.)
#   VITE_MARKETING_ORIGIN (optional. Set to https://flexyn.app once the
#                          landing site serves /p/gym/:id. Someone who
#                          scans a gym poster WITHOUT an account is then
#                          handed to the landing page — the store links
#                          are what they need — instead of the app's own
#                          read-only gym view. Unset = keep them in the
#                          app, which is what works today.)
#   VITE_POSTHOG_KEY      (optional. PostHog project API key, the public
#                          "phc_..." one. Unset = analytics stay off and
#                          nothing is sent. See src/lib/analytics.js.)
#   VITE_POSTHOG_HOST     (optional. Defaults to https://us.i.posthog.com;
#                          use https://eu.i.posthog.com for an EU project.)
# Never hardcode secrets here — this file is committed to version control.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
