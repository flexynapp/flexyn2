<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!--
      Brand + UI fonts. Loaded here in <head> with preconnect (not via a CSS
      @import in index.css) so the font files download in parallel with the
      app bundle instead of being chained behind it. The old @import
      serialized HTML -> CSS chunk -> font CSS -> font files, which on a cold
      load could leave heading text (the "F" logo + "Flexyn" wordmark are
      heading-font glyphs) briefly unpainted before the font arrived.
      display=swap keeps text visible in a fallback while the webfont loads.

      Archivo (UI headings) + Figtree (body) replaced Space Grotesk + Inter.
      That exact pairing is the single most over-represented combination in
      AI-generated frontends and reads as "generated" before a user has
      parsed a word of the copy. Archivo is a sturdier, slightly narrower
      grotesque with tight apertures and strong tabular numerals, which is
      what a stat-dense fitness UI actually needs; Figtree is a humanist
      companion that stays legible at the 11px floor where Archivo's tight
      spacing would start to close up.

      Both are requested as VARIABLE ranges (`wght@a..b`), which Google
      serves as ONE woff2 per family covering the whole axis. The old URL
      pulled 7 static Inter weights + 4 static Space Grotesk weights = 11
      files; this is 2. Ranges cover every weight the app actually uses
      (audited: font-light 300 through font-black 900).

      SPLIT INTO TWO REQUESTS — critical and deferred.

      All five families used to load from ONE render-blocking stylesheet.
      Three of them are display faces that no first paint needs, so the app
      was blocking its own render on Press Start 2P (used only by the story
      overlay editor and the Snake modal) and Caveat (story overlays only).

      Critical, below, stays render-blocking because first paint genuinely
      needs it: Archivo is --font-heading, Figtree is --font-body, and
      Leckerli One is the "Flexyn" wordmark drawn as live <text> on the
      splash screen (SplashScreen.jsx) — deferring that would show the logo
      in a fallback for a beat on every cold start, which is the one place
      a font swap is unmissable.

      Archivo loads its WIDTH axis (wdth 62..125) as well as weight, for
      the one display style, .font-display in src/index.css, which sets it
      condensed at 75%. Without the axis in this URL font-stretch still
      COMPUTES to 75% while every title renders at normal width, so a
      computed-style check cannot tell you it works; measure the glyphs.
      Cost: the Latin woff2 goes from 35 KB to 90 KB (measured 2026-09-27),
      and Google serves the same file for any sub-range of the axis, so
      asking for a narrower range saves nothing.

      Deferred uses the media="print" swap: the browser fetches it at low
      priority without blocking render, then the onload flips it live. The
      <noscript> copy keeps it working with JS disabled.

      NOT self-hosted, deliberately, though the audit recommended it and it
      would be the stronger fix — it removes the third-party dependency, the
      render-blocking request, and the total-fallback failure mode that made
      BOTH August reviews unable to judge typography at all.

      The blocker is that this app ships 15 languages. Google's css2
      endpoint returns per-script @font-face blocks split by unicode-range,
      so a browser rendering Arabic, Hindi, Japanese, Korean, Chinese or
      Russian downloads only the subset it needs — or falls through to a
      system face when the family has no coverage. Self-hosting means
      reproducing that subsetting by hand. Getting it wrong doesn't fail
      loudly; it silently serves Latin glyphs to a non-Latin reader or
      forces a 200 KB download on someone who needed 20 KB. That is worse
      than the status quo for more users than it helps, so it wants a proper
      subsetting pass (fonttools/glyphhanger) rather than a quick copy of
      the woff2 URLs.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Figtree:wght@300..900&family=Leckerli+One&display=swap" />
    <link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
          href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Caveat:wght@500;700&display=swap" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Caveat:wght@500;700&display=swap" />
    </noscript>

    <!--
      Favicon — self-hosted SVG. Used to load a PNG from media.base44.com
      which is an external CDN we don't control; if that domain ever
      goes away the tab icon breaks. SVG works in every modern browser.
      For non-SVG-capable contexts (Safari pinned tabs etc.) we ship
      /favicon.ico as a fallback when you generate one — see
      docs/icons-todo.md.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Viewport -->
    <!-- DO NOT re-add maximum-scale / user-scalable=no. They were here to
         kill accidental pinch-zoom on chat, the daily-quotes carousel and
         the story editor, but disabling zoom globally is a WCAG 1.4.4
         failure and a documented App Review accessibility flag. It also
         compounds badly with our type scale: the app renders ~818 strings
         at 9-11px, and a user who cannot read the smallest type also could
         not zoom it. Suppress unwanted pinch on the specific surfaces with
         `touch-action` instead — that is local, and it leaves the user's
         own zoom affordance intact everywhere else. -->
    <!-- `interactive-widget=resizes-content` makes the soft keyboard shrink
         the LAYOUT viewport rather than sliding the visual one. That is what
         lets full-screen shells size themselves with `svh` — a unit that
         never changes — instead of `dvh`, which tracks the iOS Safari URL
         bar continuously as it collapses and expands. A fixed element sized
         in dvh is therefore being resized on every scroll gesture, which is
         the rubber-banding you see in onboarding. See Onboarding.jsx. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />

    <!-- PWA. vite-plugin-pwa emits manifest.webmanifest; the old
         /manifest.json reference 404'd silently and broke the
         install-prompt. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- theme-color must match the manifest's theme_color in vite.config.js
         (#f97316 — brand orange) or the browser chrome / PWA splash
         render mismatched between the install screen (manifest color)
         and the running app (meta color). Use prefers-color-scheme to
         match the manifest brand on light AND the dark page bg
         (#0f1117) on dark so the address bar blends with content. -->
    <meta name="theme-color" content="#f97316" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Flexyn" />
    <!--
      iOS Safari requires a PNG apple-touch-icon — SVG is silently
      ignored and the home-screen install uses a screenshot. Until a
      real 180×180 PNG ships in /public/apple-touch-icon.png, point
      iOS at the brand SVG (modern iOS Safari does accept it as a
      better-than-screenshot fallback) AND the existing 192px PNG so
      the install has the right shape on the home screen.
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- SEO -->
    <meta name="description" content="Log every set, meal and run, and get a coach that plans your next session from what you actually did." />

    <!--
      Link previews (iMessage, Slack, WhatsApp, social). Without these
      Open Graph tags, iMessage fell back to the apple-touch-icon and
      showed the old "F" logo. og:image MUST be an absolute URL and a
      raster format (PNG/JPG — SVG is ignored by most crawlers), so it
      points at /og-image.png (the new flame logo, generated from
      favicon.svg). Keep the URL in sync if the production domain changes.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Flexyn" />
    <meta property="og:title" content="Flexyn" />
    <meta property="og:description" content="Log every set, meal and run, and get a coach that plans your next session from what you actually did." />
    <meta property="og:url" content="https://flexyn.netlify.app/" />
    <meta property="og:image" content="https://flexyn.netlify.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Flexyn — the app icon beside the Flexyn wordmark" />
    <!--
      summary_large_image, not summary. The card is 1200x630 (1.91:1), which
      is the ratio every og:image consumer is built around; `summary` renders
      a small SQUARE thumbnail and would centre-crop the lockup, cutting the
      wordmark off the sides. The two settings have to move together — a
      large image behind a `summary` card is worse than a square one.
    -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Flexyn" />
    <meta name="twitter:description" content="Log every set, meal and run, and get a coach that plans your next session from what you actually did." />
    <meta name="twitter:image" content="https://flexyn.netlify.app/og-image.png" />

    <!--
      Leaflet CSS is now bundled via npm and imported from
      src/components/cardio/RouteMap.jsx. Used to load from unpkg.com
      here, but a sync CDN stylesheet is a single point of failure —
      if unpkg blips, the map (and any visible CSS-dependent layout
      while it loads) breaks. Local bundle takes the same caching
      treatment as the rest of our assets.
    -->
    <!--
      60 characters, and the brand is FIRST for a reason. Nothing in the app
      ever assigns document.title — the seven references to it in src/ all
      just read it back for history.replaceState — so this one string is the
      title on every screen, in every tab, forever. A tab truncates to roughly
      fifteen characters, so a title that opens with anything other than
      "Flexyn" reads as an unidentifiable fragment to the user while only the
      crawler sees the rest.

      Was "Flexyn", 6 characters, which opengraph.xyz flags: the SERP gives
      you 50-60 and a six-character title wastes it. Keep og:title as the bare
      "Flexyn" though — that one is the eyebrow on a social card, where the
      description sits directly beneath it and a long title just repeats it.
    -->
    <title>Flexyn: workout, meal and progress tracking with a coach</title>
  </head>
  <body>
    <div id="root"></div>

    <!--
      ── Inline boot-time error reporter + SW kill-switch ──────────────────

      Two things this script does, in order, BEFORE main.jsx loads:

      1. KILL-SWITCH for the service worker. If the URL contains
         `?reset-sw=1` we unregister every SW and nuke every cache before
         continuing — useful when a bad SW deploy leaves users on a stale
         shell. Bookmark `https://<site>/?reset-sw=1` as a recovery URL.

      2. BOOT-TIME ERROR REPORTER. Captures `error` and
         `unhandledrejection` events and, if React never managed to
         mount, paints the error message into #root so a blank-screen
         deploy turns into a visible diagnostic the user can screenshot.

      Both are intentionally tiny vanilla JS — they must work even if
      the main bundle fails to load.
    -->
    <script>
      // Theme bootstrap — must run BEFORE first paint so dark-mode and
      // theme-color users don't see a one-frame light-theme flash. The
      // ThemeContext effect applies these values after React mounts; this
      // inline copy primes the DOM in the prior tick. Mirrors the same
      // localStorage keys / THEMES table used by src/lib/ThemeContext.jsx
      // (kept in sync by convention).
      (function () {
        try {
          var saved = localStorage.getItem('fn-dark-mode');
          if (saved === 'true') document.documentElement.classList.add('dark');
        } catch (_) {}
        try {
          // Minimal subset — primary + ring vars for first paint. Full
          // theme application happens once React mounts ThemeContext.
          var THEME_VARS = {
            'orange-slate':   { '--primary':'26 90% 50%',  '--ring':'26 90% 50%'  },
            'electric-blue':  { '--primary':'221 83% 53%', '--ring':'221 83% 53%' },
            'emerald':        { '--primary':'160 84% 39%', '--ring':'160 84% 39%' },
            'crimson':        { '--primary':'0 72% 51%',   '--ring':'0 72% 51%'   },
            'violet':         { '--primary':'263 70% 50%', '--ring':'263 70% 50%' },
            'gold':           { '--primary':'38 92% 50%',  '--ring':'38 92% 50%'  },
            'neon':           { '--primary':'142 76% 45%', '--ring':'142 76% 45%' },
            'midnight':       { '--primary':'210 55% 49%', '--ring':'210 55% 49%' },
            'plasma':         { '--primary':'329 81% 52%', '--ring':'329 81% 52%' },
            'arctic':         { '--primary':'192 91% 42%', '--ring':'192 91% 42%' },
            'brushed-steel':  { '--primary':'215 20% 55%', '--ring':'215 20% 55%' },
          };
          var id = localStorage.getItem('fn-theme') || 'orange-slate';
          var vars = THEME_VARS[id];
          if (vars) {
            var root = document.documentElement;
            for (var k in vars) root.style.setProperty(k, vars[k]);
          }
        } catch (_) {}
      })();
    </script>

    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          if (params.has('reset-sw')) {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (r) { r.unregister(); });
              });
            }
            if (window.caches && caches.keys) {
              caches.keys().then(function (keys) {
                keys.forEach(function (k) { caches.delete(k); });
              });
            }
            // Strip the param and reload once the unregister kicks off.
            params.delete('reset-sw');
            var clean = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
            setTimeout(function () { window.location.replace(clean); }, 250);
          }
        } catch (_) { /* never block boot on the kill-switch */ }

        var booted = false;
        function paintError(label, err) {
          if (booted) return; // React already painted something — don't overwrite.
          var root = document.getElementById('root');
          if (!root || root.children.length > 0) { booted = true; return; }
          var msg = (err && (err.message || err.reason && err.reason.message)) || String(err);
          var stack = (err && (err.stack || err.reason && err.reason.stack)) || '';
          root.innerHTML =
            '<div style="font-family:system-ui,sans-serif;padding:24px;color:#fff;background:#0f1117;min-height:100vh;line-height:1.5">' +
              '<h1 style="color:#f97316;margin:0 0 12px;font-size:18px">App failed to start</h1>' +
              '<p style="margin:0 0 8px;color:#cbd5e1;font-size:13px">Source: ' + label + '</p>' +
              '<pre style="background:#1e293b;color:#fca5a5;padding:12px;border-radius:8px;overflow-x:auto;font-size:12px;white-space:pre-wrap;word-break:break-word">' +
                (msg || '(no message)') +
                (stack ? '\n\n' + stack : '') +
              '</pre>' +
              '<p style="color:#94a3b8;font-size:12px;margin-top:16px">' +
                'Try <a href="?reset-sw=1" style="color:#fbbf24">resetting the service worker</a> ' +
                'or take a screenshot of this and send it to support.' +
              '</p>' +
            '</div>';
        }
        window.addEventListener('error', function (e) {
          paintError('window.error', e.error || e);
        });
        window.addEventListener('unhandledrejection', function (e) {
          paintError('unhandledrejection', e);
        });
        // After ~6 s, if #root is still empty, surface a stuck-loading hint.
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.children.length === 0 && !booted) {
            paintError('timeout', new Error('No content rendered after 6 seconds. The JavaScript bundle may have failed to load — check your network tab.'));
          }
        }, 6000);
        // Once React mounts ANYTHING, mark booted so we don't clobber it.
        var mountedObserver = new MutationObserver(function () {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            booted = true;
            mountedObserver.disconnect();
          }
        });
        if (document.getElementById('root')) {
          mountedObserver.observe(document.getElementById('root'), { childList: true });
        }
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
