  <!--
    Embers. Placed against the mark's measured geometry rather than by eye:
    the symbol's tip sits at (0.727, 0.232) of the canvas and its tail at
    (0.273, 0.771), so the hero glint sits just beyond the tip in the empty
    top-right corner, two dimmer ones scatter off it, and a fourth sits past
    the tail to balance the diagonal. All four were checked for overlap with
    the symbol — a sparkle sitting on the mark would be invisible.

    Colour is #FFD27A, the fire gradient's lightest stop, so they read as
    embers off the flame rather than as added decoration in a new hue.

    These are geometrically identical to the ones baked into the PNGs (same
    generator, same normalised coordinates), so the SVG and raster icons do
    not drift. NOTE: favicon.ico's 16px entry deliberately omits them — at
    that size a sparkle is roughly one pixel and reads as noise, so the URL
    bar gets the clean mark and 32/48 carry the detail.
  -->
