<!--
  viewBox squared to 491×491 (was 489×491). An icon slot is square, and the
  default preserveAspectRatio letterboxes a non-square viewBox to fit — which
  left ~1px transparent slivers down the left and right edges, the same
  white-halo defect as the rounded corners below, just thinner.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 491 491" width="491" height="491" role="img" aria-label="Flexyn">
  <!--
    Flexyn app icon, Iron Orange theme. Symbol auto-traced from the original
    artwork (exact shape preserved), rebuilt as vector for crisp edges at any size.
    Card-grey tile (#191F24 — the app's card surface) with a fire gradient
    (theme primary).

    The tile was #3F4D5A "iron slate" until 2026-08-10. Nothing in this file
    was ever white, but slate is light enough that against dark browser chrome
    the tile edge read as a pale outline around the mark — which is what it
    looks like at 16px in a tab or the URL bar. #191F24 is the same grey as
    every card surface in the app, so the tile sits down into dark chrome
    instead of ringing it, and still has enough separation from black to keep
    a defined square. If you ever see an actual white halo, that is the
    different defect described below: transparency composited over white.
  -->
  <defs>
    <linearGradient id="flexynFire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"  stop-color="#ffd27a"/>
      <stop offset="30%" stop-color="#fb9d38"/>
      <stop offset="62%" stop-color="#f2700d"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <!--
    FULL-BLEED, and deliberately not rounded. This rect used to be inset 5px
    with rx="40", so the tile carried its own rounded corners and everything
    outside them was transparent. Every platform that masks an app icon then
    composited that transparency over WHITE, which is the white border you see
    around the tile once Flexyn is installed to a home screen.

    Rounding is the operating system's job — iOS, Android and desktop each
    apply their own corner radius, and they differ. Supply a square, opaque
    tile and let the OS cut it; supply a pre-rounded one and you get the
    platform's radius with your radius showing through as a halo.

    This file is also referenced as an apple-touch-icon fallback in
    index.html, and iOS does not honour transparency there at all.
  -->
  <rect x="0" y="0" width="491" height="491" fill="#191F24"/>
  <!--
    Transforms read left to right.

    translate(245.5,245.5) scale(1.15) translate(-245.5,-245.5)
      Scales the mark 1.15x about the TILE CENTRE rather than the origin, so
      it grows in place instead of drifting toward the bottom-right.

      1.15 is not a taste number. A maskable icon must keep its content inside
      the inner 80% circle — radius 0.40 x canvas — because Android may crop to
      it. Measured on a 512 render, the furthest painted pixel of the mark sits
      167.6 from centre against a 204.8 limit, so the hard ceiling is x1.222.
      1.15 lands at 94% of the safe zone and takes the mark from 46% to 53% of
      the tile width. Going to 1.20 would be 98% — inside the rule, but with no
      room for the anti-aliased edge or a future tweak to the artwork.

    translate(1,0)  +1px, to keep the mark centred after the viewBox was
                    squared from 489 to 491 wide.
  -->
  <g transform="translate(245.5,245.5) scale(1.15) translate(-245.5,-245.5) translate(1,0) scale(0.25)" fill="url(#flexynFire)" fill-rule="evenodd">
    <g transform="translate(0.000000,1964.000000) scale(0.100000,-0.100000)">
