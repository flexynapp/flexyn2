name: Test

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '!docs/migrations-runbook.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '!docs/migrations-runbook.md'

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run lint
        if: '!cancelled()'

      # The vite.config.js build guard turns MISSING_EXPORT and
      # UNRESOLVED_IMPORT into failures, but until this step it only ran when
      # Netlify deployed main, i.e. after the merge it exists to stop.
      - run: npm run build
        if: '!cancelled()'
