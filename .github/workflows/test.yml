name: Test

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '!docs/migrations-runbook.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '!docs/migrations-runbook.md'

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run lint
        if: '!cancelled()'
